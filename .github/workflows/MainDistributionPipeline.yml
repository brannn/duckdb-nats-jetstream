#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # DuckDB's 2.0 release branch, not the v2.0.0 tag: the tests run on a prebuilt DuckDB when one is staged for the
    # commit, and the one staged for v2.0.0 is a development build, which does not load an extension built at the tag
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: v2.0-cyanoptera
      extension_name: nats_js
      exclude_archs: 'linux_amd64_musl;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      reduced_ci_mode: 'disabled'
      # fail, rather than skip, the tests when the extension does not load, and on Linux x86-64 and macOS run them against
      # nats-server 2.10 (one message per request) and 2.15 (batched reads); see the Makefile
      test_config: '{"test_env_variables": {"NATS_JS_FAIL_SKIPPED_TESTS": "1", "NATS_SERVER_VERSIONS": "2.10.29 2.15.1"}}'
